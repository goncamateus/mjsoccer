[project]
name = "mjsoccer"
version = "0.1.0"
description = "Gymnasium reinforcement-learning environments for a RoboCup SSL omni robot in MuJoCo"
readme = "README.md"
authors = [
    { name = "goncamateus", email = "mateus.gm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0",
    "mujoco>=3.11.0",
    "numpy>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "pillow>=11.0",
    "pytest>=8.0",
]
