[project]
name = "mjsoccer"
version = "0.1.0"
description = "Gymnasium reinforcement-learning environments for a RoboCup SSL omni robot in MuJoCo"
readme = "README.md"
authors = [
    { name = "goncamateus", email = "mateus.gm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0",
    "mujoco==4.0.0",
    "numpy>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "pillow>=11.0",
    "pytest>=8.0",
]
rl = [
    "stable-baselines3>=2.7",
    "tqdm>=4.67",       # progress_bar=True in model.learn
    "rich>=14.0",       # same
]
# The MJX-Warp backend (mjsoccer.mjx): uv sync --group gpu. Needs a CUDA GPU at run time.
gpu = [
    "mujoco-mjx[warp]==4.0.0",
    "jax[cuda12]>=0.12.0.1",
    # brax 0.14.2 on PyPI breaks on jax 0.12 (device_put_replicated); pinned until a release > 0.14.2.
    "brax @ git+https://github.com/google/brax@c8605294264a7b7546268adbb4beabc9eb624000",
]

[tool.pytest.ini_options]
# The acceptance-criteria scenarios (ticket 14) take minutes; run them with -m validation.
addopts = "-m 'not validation'"
markers = ["validation: slow acceptance-criteria scenarios (tests/test_validation.py)"]
